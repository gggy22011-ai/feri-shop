name: keepalive

# Разбудить бесплатный инстанс Render: Render усыпляет веб-сервис после ~15 минут
# без входящих запросов. Пингуем /healthz каждые 10 минут, чтобы бот не «сна»,
# а наполнители/юзеры не ловили 502 при пробуждении.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # ручной запуск для проверки

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Пинг /healthz
        run: |
          code=$(curl -sS --retry 3 --retry-delay 5 --max-time 30 \
                      -o /dev/null -w '%{http_code}' \
                      https://feri-shop.onrender.com/healthz)
          echo "healthz -> $code"
          if [ "$code" != "200" ]; then
            echo "::warning::healthz вернул $code (инстанс просыпается)"
          fi

      - name: Проверить, что бот живой
        run: |
          curl -sS --retry 2 --max-time 30 https://feri-shop.onrender.com/diag || true
