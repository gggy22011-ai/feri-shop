# Render Blueprint: веб-мир для Feris Shop (бот + сайт + /healthz против «сна»).
# Деплой: render.com -> New -> Blueprint -> выбрать GitHub-репозиторий.
#
# Секреты (BOT_TOKEN, ADMIN_IDS, ADMIN_PASSWORD) указаны как `sync: false` —
# их нужно один раз ввести руками: Service -> Environment -> Save,
# после чего Service -> Manual Deploy -> Deploy.
#
# ПРОТИВ «СНА»: на Cloudflare заведён Worker-cron (папка cloudflare/keepalive-worker),
# который каждую минуту пингует <имя>.onrender.com/healthz — бесплатный инстанс
# не засыпает. Health-check Render тоже бьёт по /healthz (он есть у FastAPI-сайта).
services:
  - type: web
    name: feri-shop
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false          # ввести руками: токен бота из @BotFather
      - key: BOT_USERNAME
        value: Shootingferi_bot
      - key: ADMIN_IDS
        sync: false          # ввести руками: user_id владельцев через запятую
      - key: ADMIN_PASSWORD
        sync: false          # ввести руками: пароль доступа к админке
      # ── Автовыдача реальных номеров (сервисы приёма SMS) ──────────────────
      # Провайдер: hero-sms | 5sim | пусто = ручной режим (как раньше).
      - key: SMS_PROVIDER
        value: ""
      - key: SMS_ACTIVATE_KEY
        sync: false          # ключ HeroSMS (https://hero-sms.com) — он же sms-activate
      - key: FIVESIM_KEY
        sync: false          # ключ 5sim (https://5sim.net)
      - key: SMS_AUTO_ISSUE
        value: "1"
      - key: SMS_SERVICE
        value: tg
      - key: SMS_PRICE_MARKUP
        value: "1.3"
      - key: SMS_COUNTRY_MAP
        value: "Россия=0;Казахстан=4;Украина=1;Беларусь=3"
      - key: SMS_COUNTRY_DEFAULT
        value: "0"
      - key: OWNERS
        value: clulk,no7777on
      - key: PAYMENT_USERNAME
        value: "@Clulk"
      - key: STAR_OWNER
        value: "@No7777oN"
      - key: SUPPORT_USERNAME
        value: "@No7777oN"
      - key: CHANNEL_1
        value: "@feris_shop"
      - key: CHANNEL_1_URL
        value: https://t.me/feris_shop
      # ВАЖНО: на бесплатном тарифе используется SQLite-файл, который живёт
      # только пока деплой не пересоздан (эпhemeral disc). Для 24/7 с сохранением
      # данных подключите Postgres (бесплатный Neon/Supabase) и раскомментируйте:
      # - key: DB_URL
      #   value: postgresql+asyncpg://USER:PASSWORD@host/neondb